<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9333ea"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5bea"/>
    </marker>
  </defs>

  <rect width="960" height="580" rx="16" fill="#ffffff"/>

  <!-- ===== Meta Quest 3 (everything runs on the headset) ===== -->
  <rect x="24" y="20" width="912" height="340" rx="14" fill="#eef2ff" stroke="#2f5bea" stroke-width="2"/>
  <text x="44" y="52" font-size="19" font-weight="700" fill="#0f172a">Meta Quest 3 <tspan font-weight="500" fill="#2f5bea" font-size="15.5">· worn around the neck · no extra computer</tspan></text>

  <!-- inputs -->
  <g>
    <rect x="48" y="78" width="236" height="66" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="166" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Stereo UVC camera</text>
    <text x="166" y="128" text-anchor="middle" font-size="13" fill="#475569">USB-C · side-by-side frames</text>

    <rect x="48" y="176" width="236" height="66" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="166" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Quest hand tracking</text>
    <text x="166" y="226" text-anchor="middle" font-size="13" fill="#475569">OpenXR hand joints, both hands</text>
  </g>

  <!-- processing -->
  <g>
    <rect x="344" y="78" width="262" height="66" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="475" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Stereo video recorder</text>
    <text x="475" y="128" text-anchor="middle" font-size="13" fill="#475569">records the camera on the headset</text>

    <rect x="344" y="176" width="262" height="66" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="475" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Hand Skeleton + Palm Pose</text>
    <text x="475" y="226" text-anchor="middle" font-size="13" fill="#475569">OpenXR → MediaPipe 21 keypoints</text>

    <rect x="344" y="274" width="262" height="62" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="475" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Gesture recognizer</text>
    <text x="475" y="321" text-anchor="middle" font-size="13" fill="#475569">Rock · Paper · Thumb, per hand</text>
  </g>

  <!-- state machine -->
  <rect x="666" y="78" width="246" height="258" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="789" y="104" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">Recording state machine</text>
  <text x="789" y="124" text-anchor="middle" font-size="12.5" fill="#9333ea" font-weight="600">same as the UMI system</text>
  <g font-family="Consolas, monospace" font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="789" y="154">Idle</text>
    <text x="789" y="182">Recording</text>
    <text x="789" y="210">Review</text>
    <text x="789" y="238">Uploading</text>
  </g>
  <g stroke="#9333ea" stroke-width="1.5" marker-end="url(#a-purple)">
    <line x1="789" y1="159" x2="789" y2="169"/>
    <line x1="789" y1="187" x2="789" y2="197"/>
    <line x1="789" y1="215" x2="789" y2="225"/>
  </g>
  <text x="684" y="270" font-size="12" font-weight="700" fill="#9333ea">GESTURE COMMANDS</text>
  <g font-size="13" fill="#334155">
    <text x="684" y="294">both fists → start / stop</text>
    <text x="684" y="316">both thumbs up → label: success</text>
  </g>

  <!-- data arrows -->
  <g stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#a-gray)">
    <line x1="284" y1="111" x2="340" y2="111"/>
    <line x1="284" y1="209" x2="340" y2="209"/>
    <path d="M250 242 L250 305 L340 305"/>
    <line x1="606" y1="305" x2="662" y2="305"/>
  </g>
  <!-- control arrows: state machine starts / stops the recorders -->
  <g stroke="#9333ea" stroke-width="1.7" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)">
    <line x1="666" y1="111" x2="610" y2="111"/>
    <line x1="666" y1="209" x2="610" y2="209"/>
  </g>
  <text x="636" y="160" text-anchor="middle" font-size="11.5" fill="#9333ea" font-weight="600">start /</text>
  <text x="636" y="174" text-anchor="middle" font-size="11.5" fill="#9333ea" font-weight="600">stop</text>

  <!-- ===== upload ===== -->
  <path d="M190 360 L190 416" stroke="#2f5bea" stroke-width="2.2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-blue)"/>
  <text x="204" y="394" font-size="13.5" font-weight="600" fill="#2f5bea">Wi-Fi upload after each episode</text>

  <rect x="48" y="420" width="284" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="190" y="460" font-size="16.5" font-weight="700" fill="#0f172a">Lab server</text>
    <text x="190" y="484" font-size="13.5" fill="#334155">same pipeline as the</text>
    <text x="190" y="504" font-size="13.5" fill="#334155">UMI Data Collection</text>
  </g>
  <line x1="332" y1="475" x2="408" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#a-gray)"/>

  <rect x="412" y="402" width="500" height="146" rx="12" fill="#ecfbf8" stroke="#0f8a7e" stroke-width="1.6"/>
  <text x="432" y="432" font-size="16.5" font-weight="700" fill="#0f172a">One EGO episode</text>
  <g font-size="14" fill="#334155">
    <text x="432" y="460">• Side-by-side stereo video</text>
    <text x="432" y="484">• Hand Skeleton, both hands (MediaPipe 21 keypoints)</text>
    <text x="432" y="508">• Palm trajectory, both hands (Palm Pose over time)</text>
    <text x="432" y="532">• Episode label (success / fail / discard)</text>
  </g>
</svg>
