<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>

  <!-- layer bands -->
  <rect x="20" y="20" width="920" height="112" rx="12" fill="#eef2ff"/>
  <rect x="20" y="146" width="920" height="112" rx="12" fill="#ecfbf8"/>
  <rect x="20" y="272" width="920" height="248" rx="12" fill="#fff8e6"/>
  <g font-size="12.5" font-weight="700" letter-spacing="0.06em">
    <text x="36" y="44" fill="#2f5bea">1 · CONNECTION LAYER</text>
    <text x="36" y="170" fill="#0f6b62">2 · DATA INGESTION LAYER</text>
    <text x="924" y="296" fill="#a16207" text-anchor="end">3 · UI / DISPLAY LAYER</text>
  </g>

  <!-- connection -->
  <rect x="330" y="48" width="300" height="68" rx="10" fill="#ffffff" stroke="#2f5bea" stroke-width="2"/>
  <text x="480" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">LiveKitRoomManager</text>
  <text x="480" y="99" text-anchor="middle" font-size="13" fill="#475569">joins the room, tracks participants</text>

  <!-- ingestion -->
  <rect x="120" y="176" width="260" height="66" rx="10" fill="#ffffff" stroke="#0f8a7e" stroke-width="2"/>
  <text x="250" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">LiveKitPublisher</text>
  <text x="250" y="225" text-anchor="middle" font-size="13" fill="#475569">sends the headset's streams</text>

  <rect x="580" y="176" width="260" height="66" rx="10" fill="#ffffff" stroke="#0f8a7e" stroke-width="2"/>
  <text x="710" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">LiveKitSubscriber</text>
  <text x="710" y="225" text-anchor="middle" font-size="13" fill="#475569">receives everyone else's</text>

  <g stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#g)">
    <path d="M400 116 L280 172"/>
    <path d="M560 116 L680 172"/>
  </g>

  <!-- sources (feed the publisher) -->
  <g>
    <rect x="36" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="106" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DataSource</text>
    <text x="106" y="372" text-anchor="middle" font-size="13" fill="#334155">teleop messages</text>
    <text x="106" y="391" text-anchor="middle" font-size="12" fill="#64748b">poses, hands,</text>
    <text x="106" y="408" text-anchor="middle" font-size="12" fill="#64748b">buttons · 200 Hz</text>

    <rect x="186" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="256" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">VideoSource</text>
    <text x="256" y="372" text-anchor="middle" font-size="13" fill="#334155">headset camera</text>

    <rect x="336" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="406" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AudioSource</text>
    <text x="406" y="372" text-anchor="middle" font-size="13" fill="#334155">headset microphone</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#g)">
    <path d="M106 318 L200 246"/>
    <path d="M256 318 L250 246"/>
    <path d="M406 318 L300 246"/>
  </g>

  <!-- sinks (fed by the subscriber) -->
  <g>
    <rect x="486" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="556" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DataSink</text>
    <text x="556" y="372" text-anchor="middle" font-size="13" fill="#334155">robot ACKs</text>
    <text x="556" y="391" text-anchor="middle" font-size="13" fill="#334155">TTS text</text>

    <rect x="636" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="706" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">VideoSink</text>
    <text x="706" y="372" text-anchor="middle" font-size="13" fill="#334155">robot camera</text>
    <text x="706" y="391" text-anchor="middle" font-size="13" fill="#334155">streams</text>

    <rect x="786" y="318" width="140" height="120" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
    <text x="856" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AudioSink</text>
    <text x="856" y="372" text-anchor="middle" font-size="13" fill="#334155">robot microphone</text>
    <text x="856" y="391" text-anchor="middle" font-size="13" fill="#334155">cloud agent voice</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#g)">
    <path d="M660 246 L560 314"/>
    <path d="M710 246 L706 314"/>
    <path d="M760 246 L850 314"/>
  </g>

  <text x="256" y="476" text-anchor="middle" font-size="13" fill="#a16207" font-weight="600">what the operator sends</text>
  <text x="706" y="476" text-anchor="middle" font-size="13" fill="#a16207" font-weight="600">what the operator sees and hears (panels in the headset)</text>
  <line x1="36" y1="490" x2="476" y2="490" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="486" y1="490" x2="926" y2="490" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4 4"/>
</svg>
