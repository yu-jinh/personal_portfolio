Hei, PingFang SC, Noto Sans SC, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">不经过 gradlew 脚本</text><line x1="240" y1="624" x2="240" y2="650" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="652" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="682" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">APK</text><text x="50" y="706" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">Builds/&lt;name&gt;_v&lt;version&gt;.apk</text><text x="480" y="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">154.6 MB，使用</text><text x="480" y="699" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Segoe UI, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">APK 签名方案 v2</text></svg>
