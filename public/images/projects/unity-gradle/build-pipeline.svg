<svg xmlns="http://www.w3.org/2000/svg" width="760" height="748" viewBox="0 0 760 748"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker></defs><rect width="760" height="748" rx="16" fill="#ffffff"/><rect x="30" y="24" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">Unity Editor</text><text x="50" y="78" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">BuildPipeline.BuildPlayer</text><text x="480" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Started from the project's</text><text x="480" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Build menu (BuildConfiguration.cs)</text><line x1="240" y1="96" x2="240" y2="122" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="124" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">C# → IL</text><text x="50" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">Roslyn compiles, UnityLinker strips</text><text x="480" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Editor-only scripts and unused</text><text x="480" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">code are left out</text><line x1="240" y1="196" x2="240" y2="222" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="224" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">IL2CPP</text><text x="50" y="278" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">IL → C++ → libil2cpp.so</text><text x="480" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">NDK clang compiles the C++;</text><text x="480" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">metadata goes to global-metadata.dat</text><line x1="240" y1="296" x2="240" y2="322" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="324" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">Gradle project written</text><text x="50" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">templates + Player Settings + callbacks</text><text x="480" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Output: Library/Bee/Android/</text><text x="480" y="371" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Prj/IL2CPP/Gradle/</text><line x1="240" y1="396" x2="240" y2="422" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="424" width="420" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="50" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#18181b" text-anchor="start">Gradle 9.3.1 + AGP 9.1.1: assembleRelease</text><rect x="50" y="468" width="380" height="58" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3"/><text x="66" y="492" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#18181b" text-anchor="start">:unityLibrary  →  AAR</text><text x="66" y="513" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">Java, AARs, CMake (libgame.so), assets</text><line x1="240" y1="526" x2="240" y2="546" stroke="#c2410c" stroke-width="1.8" marker-end="url(#o)"/><rect x="50" y="548" width="380" height="58" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.3"/><text x="66" y="572" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#18181b" text-anchor="start">:launcher  →  APK</text><text x="66" y="593" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534e" text-anchor="start">merge manifests, dex, package, sign</text><text x="480" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">Unity starts Gradle directly</text><text x="480" y="523" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">in the launcher/ folder;</text><text x="480" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">no gradlew script</text><line x1="240" y1="624" x2="240" y2="650" stroke="#57534e" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="652" width="420" height="72" rx="10" fill="#f5f5f4" stroke="#18181b" stroke-width="1.5"/><text x="50" y="682" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="start">APK</text><text x="50" y="706" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#57534e" text-anchor="start">Builds/&lt;name&gt;_v&lt;version&gt;.apk</text><text x="480" y="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">154.6 MB, signed with</text><text x="480" y="699" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534e" text-anchor="start">APK Signature Scheme v2</text></svg>
