<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5bea"/></marker>
  </defs>
  <rect width="960" height="300" rx="16" fill="#ffffff"/>

  <!-- frames -->
  <g text-anchor="middle">
    <rect x="24" y="70" width="190" height="120" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
    <text x="119" y="104" font-size="16" font-weight="700" fill="#0f172a">Object</text>
    <text x="119" y="128" font-size="13" fill="#334155">its own frame</text>
    <text x="119" y="148" font-size="13" fill="#334155">(from its CAD model)</text>

    <rect x="270" y="70" width="190" height="120" rx="12" fill="#ecfbf8" stroke="#0f8a7e" stroke-width="1.8"/>
    <text x="365" y="104" font-size="16" font-weight="700" fill="#0f172a">Camera</text>
    <text x="365" y="128" font-size="13" fill="#334155">calibrated: intrinsics K,</text>
    <text x="365" y="148" font-size="13" fill="#334155">distortion</text>

    <rect x="516" y="70" width="190" height="120" rx="12" fill="#fff8e6" stroke="#ca8a04" stroke-width="1.8"/>
    <text x="611" y="104" font-size="16" font-weight="700" fill="#0f172a">Robot base</text>
    <text x="611" y="128" font-size="13" fill="#334155">where the robot</text>
    <text x="611" y="148" font-size="13" fill="#334155">plans its motion</text>

    <rect x="762" y="70" width="174" height="120" rx="12" fill="#eef2ff" stroke="#2f5bea" stroke-width="1.8"/>
    <text x="849" y="104" font-size="16" font-weight="700" fill="#0f172a">Twin in AR</text>
    <text x="849" y="128" font-size="13" fill="#334155">robot model placed</text>
    <text x="849" y="148" font-size="13" fill="#334155">in the headset's world</text>
  </g>

  <g stroke="#2f5bea" stroke-width="2.4" marker-end="url(#a)">
    <line x1="214" y1="130" x2="264" y2="130"/>
    <line x1="460" y1="130" x2="510" y2="130"/>
    <line x1="706" y1="130" x2="756" y2="130"/>
  </g>

  <g text-anchor="middle" font-size="13" font-weight="700" fill="#2f5bea">
    <text x="242" y="222">FoundationPose</text>
    <text x="488" y="222">Hand-eye calibration</text>
    <text x="734" y="222">Twin placement</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#475569">
    <text x="242" y="242">6D pose: camera ← object</text>
    <text x="488" y="242">ArUco: base ← camera</text>
    <text x="734" y="242">marker · grab · nav map</text>
  </g>
  <line x1="242" y1="140" x2="242" y2="206" stroke="#94a3b8" stroke-dasharray="3 4"/>
  <line x1="488" y1="140" x2="488" y2="206" stroke="#94a3b8" stroke-dasharray="3 4"/>
  <line x1="734" y1="140" x2="734" y2="206" stroke="#94a3b8" stroke-dasharray="3 4"/>

  <text x="24" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.06em">CHAINING TRANSFORMS: EACH ARROW IS ONE RIGID TRANSFORM (ROTATION + TRANSLATION)</text>
  <text x="480" y="280" text-anchor="middle" font-size="13.5" fill="#0f172a">Multiply them in order and the object lands on the twin's table, exactly where it sits on the real one.</text>
</svg>
